<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- KD Squares brand: primary #006994, cyan #00ECFF, gold #D6AC50 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#0a8fbd"/><stop offset="0.5" stop-color="#006994"/><stop offset="1" stop-color="#00364f"/></linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75"><stop offset="0" stop-color="#8ff6ff" stop-opacity="0.30"/><stop offset="1" stop-color="#8ff6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="0.34" cy="0.28" r="0.85"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#d9f6fb"/><stop offset="1" stop-color="#7fd3e6"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66f2ff"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#66f2ff"/></linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#f6e2a4"/><stop offset="0.45" stop-color="#d6ac50"/><stop offset="1" stop-color="#a47a28"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#d6ac50" stop-opacity="0.6"/><stop offset="1" stop-color="#d6ac50" stop-opacity="0"/></radialGradient>
