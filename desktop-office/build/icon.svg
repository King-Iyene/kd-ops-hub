  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="#00ecff" stroke-opacity="0.28" stroke-width="6"/>
  <ellipse cx="512" cy="512" rx="440" ry="190" fill="none" stroke="#00ecff" stroke-opacity="0.30" stroke-width="8" transform="rotate(-24 512 512)"/>
