<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7eef3"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b86b8"/><stop offset="1" stop-color="#005a7d"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00709c"/><stop offset="1" stop-color="#00455f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecc979"/><stop offset="1" stop-color="#c9a145"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4effa"/><stop offset="1" stop-color="#8fcfe9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00334a" flood-opacity="0.35"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00283a" flood-opacity="0.4"/></filter>
    <clipPath id="sq"><rect x="30" y="30" width="964" height="964" rx="236"/></clipPath>
  </defs>
  <rect x="30" y="30" width="964" height="964" rx="236" fill="url(#bg)"/>
  <rect x="30" y="30" width="964" height="964" rx="236" fill="none" stroke="#c9d8e1" stroke-width="6"/>
  <!-- the room from above: blue walls, lighter blue floor -->
  <g filter="url(#shadow)">
    <rect x="182" y="212" width="660" height="560" rx="76" fill="url(#wall)"/>
  </g>
  <rect x="226" y="256" width="572" height="472" rx="40" fill="url(#floor)"/>
  <!-- floor tiles -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="3">
    <line x1="369" y1="260" x2="369" y2="724"/><line x1="512" y1="260" x2="512" y2="724"/><line x1="655" y1="260" x2="655" y2="724"/>
    <line x1="230" y1="372" x2="794" y2="372"/><line x1="230" y1="492" x2="794" y2="492"/><line x1="230" y1="612" x2="794" y2="612"/>
  </g>
  <!-- the doorway cut in the bottom wall, with a gold door swung open -->
  <rect x="436" y="728" width="152" height="50" fill="#e7eef3"/>
  <rect x="436" y="724" width="152" height="10" fill="url(#floor)"/>
  <line x1="588" y1="752" x2="588" y2="880" stroke="#d9b155" stroke-width="24" stroke-linecap="round"/>
  <circle cx="588" cy="752" r="16" fill="url(#gold)"/>
  <path d="M436 752 A152 152 0 0 0 588 904" fill="none" stroke="#c9a145" stroke-opacity="0.6" stroke-width="6" stroke-dasharray="3 14" stroke-linecap="round"/>
  <!-- connections between the people -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16">
    <path d="M372 428 Q 450 340 548 384"/>
    <path d="M372 428 Q 392 520 468 588"/>
    <path d="M628 400 Q 640 504 560 588"/>
  </g>
  <!-- pulse around the middle person -->
  <g fill="none" stroke="#ffffff">
    <circle cx="512" cy="598" r="120" stroke-opacity="0.14" stroke-width="6"/>
    <circle cx="512" cy="598" r="90" stroke-opacity="0.26" stroke-width="6"/>
  </g>
  <!-- three people -->
  <g filter="url(#soft)">
    <circle cx="372" cy="428" r="62" fill="url(#sky)"/>
    <circle cx="628" cy="400" r="62" fill="url(#gold)"/>
    <circle cx="512" cy="598" r="70" fill="#ffffff"/>
  </g>
  <g fill="#00455f">
    <circle cx="372" cy="412" r="18"/><path d="M338 458 a34 28 0 0 1 68 0 z"/>
    <circle cx="628" cy="384" r="18"/><path d="M594 430 a34 28 0 0 1 68 0 z"/>
    <circle cx="512" cy="580" r="20"/><path d="M474 630 a38 30 0 0 1 76 0 z"/>
  </g>
  <g fill="none" stroke-width="4">
    <circle cx="372" cy="428" r="62" stroke="#ffffff" stroke-opacity="0.9"/>
    <circle cx="628" cy="400" r="62" stroke="#ffffff" stroke-opacity="0.9"/>
    <circle cx="512" cy="598" r="70" stroke="#ecc979"/>
  </g>
  <!-- a plant and a desk so it reads as an office -->
  <g>
    <rect x="662" y="620" width="116" height="84" rx="16" fill="#00455f" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5"/>
    <rect x="684" y="640" width="56" height="34" rx="6" fill="#d4effa" opacity="0.9"/>
    <circle cx="272" cy="316" r="26" fill="#3aa876"/><circle cx="294" cy="342" r="18" fill="#6fcf9f"/><circle cx="258" cy="338" r="14" fill="#2b8a5f"/>
  </g>
</svg>
