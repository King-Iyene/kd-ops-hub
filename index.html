<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy — narrows what the browser will execute,
      load, or connect to. Mitigates XSS where stored data ends up
      rendered. Tweak only if you know why.
        - script-src 'self' 'unsafe-inline' kept until we move the
          favicon override to a non-inline module.
        - connect-src lists every backend the SPA legitimately calls.
        - frame-src lets us iframe Supabase storage signed URLs (PDF preview).
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com https://cdn.jsdelivr.net;
      worker-src 'self' blob: https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.paystack.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io https://maps.googleapis.com https://maps.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net https://*.app.n8n.cloud https://*.n8n.cloud;
      frame-src 'self' https://*.supabase.co blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <title>KD Ops — Operations Platform for KD Squares</title>
    <meta name="description" content="KD Ops — payroll, payments, fleet, expenses, compliance, and HR for Nigerian businesses. Built by KD Squares Ltd." />
    <meta name="author" content="KD Squares Ltd" />

    <!-- Open Graph (Facebook, WhatsApp, Slack, LinkedIn link previews) -->
    <meta property="og:title" content="KD Ops — Operations Platform" />
    <meta property="og:description" content="Payroll, payments, fleet, expenses, compliance, and HR for Nigerian businesses. Built by KD Squares Ltd." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KD Ops" />
    <meta property="og:url" content="https://ops.kdsquares.com" />
    <meta property="og:image" content="https://ops.kdsquares.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="KD Squares logomark" />

    <!-- Twitter / X cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KD Ops — Operations Platform" />
    <meta name="twitter:description" content="Payroll, payments, fleet, expenses, compliance, and HR for Nigerian businesses." />
    <meta name="twitter:image" content="https://ops.kdsquares.com/icon-512.png" />

    <!-- PWA — installable on iOS/Android/desktop. The manifest link and the
         /registerSW.js script tag are both injected at build time by
         vite-plugin-pwa; the meta tags below are what iOS Safari needs to
         honour the home-screen install (it ignores the manifest icons and
         uses apple-touch-icon instead). -->
    <meta name="theme-color" content="#006994" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KD Ops" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Favicon — modern PNG first (carries the real KD logo), .ico
         fallback for legacy browsers. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
