<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KD Ops Tracker Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    #card {
      /* The whole card is the drag handle — this is a glanceable status
         pill, not a window with content to select/click inside besides the
         two explicit buttons below. */
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      background: rgba(15, 17, 21, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      color: #e5e7eb;
      box-sizing: border-box;
    }
    #dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
      transition: background-color 0.3s ease;
    }
    #dot.tracking {
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
      animation: pulse 2s infinite;
    }
    #dot.idle { background: #fbbf24; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
      70%  { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }
    #text { display: flex; flex-direction: column; line-height: 1.25; flex: 1; min-width: 0; }
    #label { font-size: 11px; font-weight: 600; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #elapsed { font-size: 11px; color: #9ca3af; font-variant-numeric: tabular-nums; }
    #open-btn {
      -webkit-app-region: no-drag;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      flex-shrink: 0;
    }
    #open-btn:hover { background: rgba(255, 255, 255, 0.16); }
  </style>
</head>
<body>
  <div id="card">
    <div id="dot"></div>
    <div id="text">
      <div id="label">Starting…</div>
      <div id="elapsed">00:00:00</div>
    </div>
    <button id="open-btn" title="Open KD Ops Time Tracker">⋯</button>
  </div>
  <script src="./widget.js"></script>
</body>
</html>
