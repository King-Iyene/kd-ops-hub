<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: #15151a; color: #f2f2f5; height: 100vh; display: flex; flex-direction: column;
  }
  #search {
    margin: 10px 10px 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid #333;
    background: #1f1f26; color: #f2f2f5; font-size: 13px; outline: none;
  }
  #search:focus { border-color: #22c55e; }
  #list { flex: 1; overflow-y: auto; padding: 4px 6px 10px; }
  .row {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.3;
  }
  .row:hover, .row.active { background: #2a2a33; }
  .row .task { font-weight: 600; }
  .row .path { color: #9b9ba3; font-size: 11px; margin-top: 1px; }
  #empty { padding: 20px; text-align: center; color: #9b9ba3; font-size: 12px; }
  #no-task {
    margin: 2px 6px 6px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    color: #9b9ba3; border-bottom: 1px solid #2a2a33;
  }
  #no-task:hover { background: #2a2a33; }
</style>
</head>
<body>
  <input id="search" type="text" placeholder="Search tasks, projects, clients…" autofocus />
  <div id="no-task">No Task — stop tracking time</div>
  <div id="list"></div>
  <script src="task-picker.js"></script>
</body>
</html>
