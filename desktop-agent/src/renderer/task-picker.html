<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: #15151a; color: #f2f2f5; height: 100vh; display: flex; flex-direction: column;
  }
  #search-row { display: flex; align-items: center; margin: 10px 10px 2px; gap: 8px; }
  #search {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #333;
    background: #1f1f26; color: #f2f2f5; font-size: 13px; outline: none;
  }
  #search:focus { border-color: #22c55e; }
  #create-link {
    margin: 4px 10px 6px; padding: 6px 4px; font-size: 12px; color: #60a5fa; cursor: pointer;
  }
  #create-link:hover { text-decoration: underline; }
  #list { flex: 1; overflow-y: auto; padding: 4px 6px 10px; }
  .section-header {
    padding: 8px 10px 4px; font-size: 11px; font-weight: 700; color: #9b9ba3;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .group-row {
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    color: #cfcfd6; display: flex; align-items: center; gap: 6px;
  }
  .group-row:hover { background: #22222a; }
  .group-row .chevron { font-size: 10px; width: 10px; display: inline-block; transition: transform 0.1s ease; }
  .group-row.collapsed .chevron { transform: rotate(-90deg); }
  .project-row { padding-left: 20px; }
  .row {
    padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.3;
  }
  .row.task-row { padding-left: 34px; }
  .row:hover, .row.active { background: #2a2a33; }
  .row .task { font-weight: 600; }
  .row .path { color: #9b9ba3; font-size: 11px; margin-top: 1px; }
  .row.add-task-row { padding-left: 34px; color: #60a5fa; font-size: 12px; }
  .row.add-task-row:hover { text-decoration: underline; }
  #empty { padding: 20px; text-align: center; color: #9b9ba3; font-size: 12px; }
  #no-task {
    margin: 2px 6px 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    color: #9b9ba3; border-bottom: 1px solid #2a2a33;
  }
  #no-task:hover { background: #2a2a33; }

  /* Inline "Create task" form, shown in place of #list */
  #create-form { display: none; flex: 1; padding: 10px; overflow-y: auto; }
  #create-form.visible { display: block; }
  #create-form label { display: block; font-size: 11px; color: #9b9ba3; margin: 10px 0 4px; }
  #create-form label:first-child { margin-top: 0; }
  #create-form input[type="text"], #create-form select {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid #333;
    background: #1f1f26; color: #f2f2f5; font-size: 13px; outline: none;
  }
  #create-form input[type="text"]:focus, #create-form select:focus { border-color: #22c55e; }
  #create-checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: #cfcfd6; }
  #create-error { color: #f87171; font-size: 12px; margin-top: 8px; }
  #create-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #create-actions button {
    padding: 6px 14px; border-radius: 6px; border: none; font-size: 12px; cursor: pointer;
  }
  #create-cancel { background: #2a2a33; color: #f2f2f5; }
  #create-cancel:hover { background: #33333d; }
  #create-submit { background: #22c55e; color: #0a0a0a; font-weight: 600; }
  #create-submit:hover { background: #16a34a; }
  #create-submit:disabled { background: #1f3d2a; color: #6b7280; cursor: default; }
</style>
</head>
<body>
  <div id="search-row">
    <input id="search" type="text" placeholder="Search tasks, projects, clients…" autofocus />
  </div>
  <div id="create-link">+ Create task…</div>
  <div id="no-task">No Task — stop tracking time</div>
  <div id="list"></div>

  <div id="create-form">
    <label for="create-name">Task name</label>
    <input id="create-name" type="text" placeholder="e.g. Draft Q4 proposal" />

    <label for="create-project">Project</label>
    <select id="create-project"></select>

    <div id="create-checkbox-row">
      <input id="create-select-after" type="checkbox" checked />
      <label for="create-select-after" style="margin:0; color:#cfcfd6; font-size:12px;">Select this task after adding it</label>
    </div>

    <div id="create-error"></div>

    <div id="create-actions">
      <button id="create-cancel">Cancel</button>
      <button id="create-submit">Add task</button>
    </div>
  </div>

  <script src="task-picker.js"></script>
</body>
</html>
