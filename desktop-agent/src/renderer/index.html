<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KD Ops Time Tracker</title>
  <style>
    body { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; padding: 24px 24px 20px; background: radial-gradient(120% 80% at 50% 0%, #0b2a40 0%, #0f1115 60%); color: #e5e7eb; }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin: 4px 0 22px; }
    .brand img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0, 105, 148, 0.45); }
    h1 { font-size: 17px; margin: 12px 0 2px; font-weight: 650; }
    .sub { font-size: 12px; color: #9ca3af; margin: 0; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #2b3340; background: #151a22; color: #e5e7eb; outline: none; }
    input:focus { border-color: #1aa3d6; box-shadow: 0 0 0 3px rgba(26, 163, 214, 0.2); }
    button { width: 100%; padding: 10px; margin-top: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, #006994, #1aa3d6); color: white; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    #status { margin-top: 16px; font-size: 13px; color: #9ca3af; }
    #error { color: #f87171; font-size: 12px; margin-top: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="./app-icon.png" alt="" />
    <h1>KD Ops Time Tracker</h1>
    <p class="sub">Sign in to start tracking your time</p>
  </div>
  <div id="login-view">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="sign-in-btn">Sign in</button>
    <div id="error"></div>
  </div>
  <div id="signed-in-view" class="hidden">
    <p id="whoami"></p>
    <p id="status">Checking agent status…</p>
    <button id="sign-out-btn">Sign out</button>
  </div>
  <div id="config-error-view" class="hidden">
    <p id="config-error-text" style="color:#f87171;font-size:13px;"></p>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
