<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KD Ops Time Tracker</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
      color: #e8edf3;
      background:
        radial-gradient(90% 55% at 50% -5%, rgba(26, 163, 214, 0.38) 0%, rgba(0, 105, 148, 0.16) 45%, transparent 75%),
        radial-gradient(70% 40% at 100% 100%, rgba(212, 173, 82, 0.10) 0%, transparent 70%),
        #0a0f16;
      display: flex; flex-direction: column; padding: 28px 28px 18px; overflow: hidden; user-select: none;
    }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
    .logo-wrap { position: relative; width: 92px; height: 92px; margin-bottom: 14px; }
    .logo-wrap::before { content: ''; position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, rgba(26, 163, 214, 0.45), transparent 68%); filter: blur(6px); }
    .logo-wrap img { position: relative; width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 105, 148, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
    h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.2px; margin: 0 0 4px; }
    .sub { font-size: 12.5px; color: #8b97a8; margin: 0; }

    .card { background: rgba(21, 27, 37, 0.72); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px; padding: 18px; backdrop-filter: blur(8px); user-select: text; }
    label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #8b97a8; margin: 0 0 6px 2px; }
    .field { position: relative; margin-bottom: 14px; }
    .field svg.lead { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; margin-top: -8px; stroke: #6b7788; fill: none; stroke-width: 1.8; pointer-events: none; }
    input { width: 100%; padding: 11px 12px 11px 38px; border-radius: 10px; border: 1px solid #263040; background: #0f141c; color: #e8edf3; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
    input::placeholder { color: #566174; }
    input:focus { border-color: #1aa3d6; box-shadow: 0 0 0 3px rgba(26, 163, 214, 0.18); }
    .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; padding: 0; margin: 0; background: transparent; border: none; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
    .eye:hover { background: rgba(255, 255, 255, 0.06); }
    .eye svg { width: 17px; height: 17px; stroke: #8b97a8; fill: none; stroke-width: 1.8; }
    #password { padding-right: 44px; }

    button.primary { width: 100%; padding: 12px; margin-top: 4px; border-radius: 10px; border: none; color: #fff; font-size: 14px; font-weight: 650; cursor: pointer; background: linear-gradient(135deg, #006994, #1aa3d6); box-shadow: 0 6px 18px rgba(0, 105, 148, 0.4); transition: filter .15s, transform .05s; }
    button.primary:hover { filter: brightness(1.12); }
    button.primary:active { transform: translateY(1px); }
    button.primary:disabled { opacity: 0.65; cursor: default; filter: none; }
    button.secondary { width: 100%; padding: 11px; margin-top: 14px; border-radius: 10px; border: 1px solid #2b3646; background: transparent; color: #cbd5e1; font-size: 13px; cursor: pointer; }
    button.secondary:hover { background: rgba(255, 255, 255, 0.05); }
    .spinner { display: inline-block; width: 13px; height: 13px; margin-right: 8px; vertical-align: -2px; border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error { display: none; margin-bottom: 12px; padding: 9px 11px; border-radius: 9px; font-size: 12.5px; line-height: 1.4; color: #fecaca; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); }
    #error.show { display: block; }

    .person { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px; color: #fff; background: linear-gradient(135deg, #006994, #1aa3d6); flex: none; }
    #whoami { margin: 0; font-size: 13.5px; word-break: break-all; }
    .chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; font-size: 12.5px; background: rgba(148, 163, 184, 0.12); color: #cbd5e1; }
    .chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .chip.on { background: rgba(34, 197, 94, 0.14); color: #86efac; }
    .chip.on::before { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25); }

    .spacer { flex: 1; }
    .foot { text-align: center; font-size: 11px; line-height: 1.5; color: #5d6a7c; margin-top: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo-wrap"><img src="./app-icon.png" alt="" /></div>
    <h1>KD Ops Time Tracker</h1>
    <p class="sub" id="tagline">Sign in to start tracking your time</p>
  </div>

  <div class="card" id="login-view">
    <div id="error" role="alert"></div>
    <label for="email">Work email</label>
    <div class="field">
      <svg class="lead" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
      <input id="email" type="email" placeholder="you@kdsquares.com" autocomplete="username" />
    </div>
    <label for="password">Password</label>
    <div class="field">
      <svg class="lead" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V8a4 4 0 018 0v2"/></svg>
      <input id="password" type="password" placeholder="Your password" autocomplete="current-password" />
      <button class="eye" id="toggle-pw" type="button" title="Show password" aria-label="Show password">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="primary" id="sign-in-btn">Sign in</button>
  </div>

  <div class="card hidden" id="signed-in-view">
    <div class="person">
      <div class="avatar" id="avatar">?</div>
      <p id="whoami"></p>
    </div>
    <span class="chip" id="status">Checking tracker status…</span>
    <button class="secondary" id="sign-out-btn">Sign out</button>
  </div>

  <div class="card hidden" id="config-error-view">
    <p id="config-error-text" style="color:#fca5a5;font-size:13px;margin:0;"></p>
  </div>

  <div class="spacer"></div>
  <div class="foot">Time and activity are recorded only while a task timer is running.<br />KD Squares · KD Ops</div>
  <script src="./renderer.js"></script>
</body>
</html>
