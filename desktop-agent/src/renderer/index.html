<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KD Ops Time Tracker</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; padding: 20px; background: #0f1115; color: #e5e7eb; }
    h1 { font-size: 16px; margin: 0 0 16px; }
    input { width: 100%; padding: 8px; margin: 6px 0; border-radius: 6px; border: 1px solid #333; background: #1a1d24; color: #e5e7eb; }
    button { width: 100%; padding: 8px; margin-top: 10px; border-radius: 6px; border: none; background: #4f46e5; color: white; cursor: pointer; }
    #status { margin-top: 16px; font-size: 13px; color: #9ca3af; }
    #error { color: #f87171; font-size: 12px; margin-top: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>KD Ops Time Tracker</h1>
  <div id="login-view">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="sign-in-btn">Sign in</button>
    <div id="error"></div>
  </div>
  <div id="signed-in-view" class="hidden">
    <p id="whoami"></p>
    <p id="status">Checking agent status…</p>
    <button id="sign-out-btn">Sign out</button>
  </div>
  <div id="config-error-view" class="hidden">
    <p id="config-error-text" style="color:#f87171;font-size:13px;"></p>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
