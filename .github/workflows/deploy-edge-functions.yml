name: Deploy Supabase Edge Functions

# ─── SETUP ───────────────────────────────────────────────────────────────────
#
# This workflow deploys edge functions when supabase/functions/** changes.
#
# Required GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN  — Personal Access Token from:
#                            https://supabase.com/dashboard/account/tokens
#                            Must be a PERSONAL ACCESS TOKEN (not the project
#                            anon key or service_role key — those won't work).
#                            Create one named "GitHub Actions" with full access.
#
#   SUPABASE_PROJECT_REF   — Your project ref (the slug in your Supabase URL).
#                            e.g. if your URL is:
#                            https://supabase.com/dashboard/project/abcdefgh
#                            then SUPABASE_PROJECT_REF = abcdefgh
#
# If you see a 403 "account does not have necessary privileges":
#   → Your token is wrong. It must be a Personal Access Token, not a project key.
#   → Go to https://supabase.com/dashboard/account/tokens and create a new one.
#   → Update the SUPABASE_ACCESS_TOKEN secret with the new token.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          VERSION=$(curl -fsSL "https://api.github.com/repos/supabase/cli/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Installing Supabase CLI v${VERSION}"
          curl -fsSLo supabase.deb \
            "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_${VERSION}_linux_amd64.deb"
          sudo dpkg -i supabase.deb
          rm -f supabase.deb
          supabase --version

      - name: Deploy paystack-transfer
        run: supabase functions deploy paystack-transfer --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy paystack-webhook
        run: supabase functions deploy paystack-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy paystack-reconciliation
        run: supabase functions deploy paystack-reconciliation --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy send-email
        run: supabase functions deploy send-email --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy vapid-keys
        run: supabase functions deploy vapid-keys --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy fx-rate-sync
        run: supabase functions deploy fx-rate-sync --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      # All KD Ops functions run with --no-verify-jwt: they authenticate in
      # code (cron secret / webhook signature / user JWT + role check), which
      # is Supabase's recommended pattern. Keep this flag on every deploy so a
      # redeploy never silently re-enables the JWT gate and breaks cron jobs.
      - name: Deploy batch-worker
        run: supabase functions deploy batch-worker --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy payroll-scheduler
        run: supabase functions deploy payroll-scheduler --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy heyreach-sync
        run: supabase functions deploy heyreach-sync --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy data-retention-runner
        run: supabase functions deploy data-retention-runner --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy fleet-alerts
        run: supabase functions deploy fleet-alerts --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy export-transfer-audit
        run: supabase functions deploy export-transfer-audit --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy record-failed-login
        run: supabase functions deploy record-failed-login --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy bulk-email-sender
        run: supabase functions deploy bulk-email-sender --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy chatbot-chat
        run: supabase functions deploy chatbot-chat --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Deploy chatbot-embed
        run: supabase functions deploy chatbot-embed --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
