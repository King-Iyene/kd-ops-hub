name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy paystack-transfer
        run: supabase functions deploy paystack-transfer --project-ref jsgdueezvrifykrreuun --no-verify-jwt

      - name: Deploy paystack-webhook
        run: supabase functions deploy paystack-webhook --project-ref jsgdueezvrifykrreuun --no-verify-jwt

      - name: Deploy send-email
        run: supabase functions deploy send-email --project-ref jsgdueezvrifykrreuun --no-verify-jwt
