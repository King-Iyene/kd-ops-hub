name: Deploy Supabase Edge Functions

# ─── SETUP ───────────────────────────────────────────────────────────────────
#
# This workflow deploys edge functions when supabase/functions/** changes.
#
# Required GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN  — Personal Access Token from:
#                            https://supabase.com/dashboard/account/tokens
#                            Must be a PERSONAL ACCESS TOKEN (not the project
#                            anon key or service_role key — those won't work).
#                            Create one named "GitHub Actions" with full access.
#
#   SUPABASE_PROJECT_REF   — Your project ref (the slug in your Supabase URL).
#                            e.g. if your URL is:
#                            https://supabase.com/dashboard/project/abcdefgh
#                            then SUPABASE_PROJECT_REF = abcdefgh
#
# If you see a 403 "account does not have necessary privileges":
#   → Your token is wrong. It must be a Personal Access Token, not a project key.
#   → Go to https://supabase.com/dashboard/account/tokens and create a new one.
#   → Update the SUPABASE_ACCESS_TOKEN secret with the new token.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          VERSION=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/supabase/cli/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Installing Supabase CLI v${VERSION}"
          curl -fsSLo supabase.deb \
            "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_${VERSION}_linux_amd64.deb"
          sudo dpkg -i supabase.deb
          rm -f supabase.deb
          supabase --version

      - name: Set Paystack proxy secrets
        run: |
          supabase secrets set \
            PAYSTACK_PROXY_URL="${{ secrets.PAYSTACK_PROXY_URL }}" \
            PAYSTACK_PROXY_KEY="${{ secrets.PROXY_KEY }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --yes

      - name: Deploy paystack-transfer
        run: supabase functions deploy paystack-transfer --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy paystack-webhook
        run: supabase functions deploy paystack-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy paystack-reconciliation
        run: supabase functions deploy paystack-reconciliation --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy send-email
        run: supabase functions deploy send-email --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy send-push
        run: supabase functions deploy send-push --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy vapid-keys
        run: supabase functions deploy vapid-keys --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy fx-rate-sync
        run: supabase functions deploy fx-rate-sync --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # All KD Ops functions run with --no-verify-jwt: they authenticate in
      # code (cron secret / webhook signature / user JWT + role check), which
      # is Supabase's recommended pattern. Keep this flag on every deploy so a
      # redeploy never silently re-enables the JWT gate and breaks cron jobs.
      - name: Deploy site-icons
        run: supabase functions deploy site-icons --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy batch-worker
        run: supabase functions deploy batch-worker --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy payroll-scheduler
        run: supabase functions deploy payroll-scheduler --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy heyreach-sync
        run: supabase functions deploy heyreach-sync --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy data-retention-runner
        run: supabase functions deploy data-retention-runner --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy fleet-alerts
        run: supabase functions deploy fleet-alerts --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy export-transfer-audit
        run: supabase functions deploy export-transfer-audit --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy office-turn
        run: supabase functions deploy office-turn --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy office-guest
        run: supabase functions deploy office-guest --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy record-failed-login
        run: supabase functions deploy record-failed-login --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy bulk-email-sender
        run: supabase functions deploy bulk-email-sender --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy chatbot-chat
        run: supabase functions deploy chatbot-chat --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy chatbot-embed
        run: supabase functions deploy chatbot-embed --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # ── Flutterwave provider (dormant until Settings toggle is flipped) ──
      # Mirror of the Paystack trio + the super_admin-only provider-switch
      # handler. All four run with --no-verify-jwt: auth happens inside each
      # function (JWT + role check, or webhook signature for the receiver).
      - name: Deploy flutterwave-transfer
        run: supabase functions deploy flutterwave-transfer --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy flutterwave-webhook
        run: supabase functions deploy flutterwave-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy flutterwave-reconciliation
        run: supabase functions deploy flutterwave-reconciliation --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy provider-switch
        run: supabase functions deploy provider-switch --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # ── Receipt OCR — primary scanner via Google Document AI ──
      - name: Deploy extract-receipt
        run: supabase functions deploy extract-receipt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy payroll-disburse
        run: supabase functions deploy payroll-disburse --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy campaign-scheduler
        run: supabase functions deploy campaign-scheduler --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy message-campaign-sender
        run: supabase functions deploy message-campaign-sender --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Auth happens in code (verifies caller is an active super_admin) —
      # --no-verify-jwt so the platform doesn't 401 the CORS preflight
      # OPTIONS request before the function's own handler ever runs.
      - name: Deploy impersonate-user
        run: supabase functions deploy impersonate-user --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # ── Database platform (NocoDB-style) ──
      - name: Deploy ddl-executor
        run: supabase functions deploy ddl-executor --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy data-api
        run: supabase functions deploy data-api --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # ── Developer module: public REST API + webhooks ──
      - name: Deploy rest-api
        run: supabase functions deploy rest-api --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy webhook-dispatcher
        run: supabase functions deploy webhook-dispatcher --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Cron-only (X-Cron-Secret) — ticked once a minute by pg_cron via
      # tick_webhook_retry_worker(), see 20261220500000_webhook_retry.sql.
      - name: Deploy webhook-retry-worker
        run: supabase functions deploy webhook-retry-worker --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy webhook-replay
        run: supabase functions deploy webhook-replay --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy webhook-proxy
        run: supabase functions deploy webhook-proxy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      - name: Deploy automation-runner
        run: supabase functions deploy automation-runner --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Cron-only (X-Cron-Secret) hourly tick via tick_timetrack_export_runner(),
      # see 20261260000000_timetrack_export_center.sql — plus a direct admin
      # JWT call for the Export Center's "Send now" button.
      - name: Deploy timetrack-export-runner
        run: supabase functions deploy timetrack-export-runner --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Ops Agent: AI status and test. Checks the caller's JWT and Super Admin / Admin role itself.
      # Needs the ANTHROPIC_API_KEY secret (supabase secrets set), which is never kept in this repo.
      - name: Deploy agent-ai
        run: supabase functions deploy agent-ai --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Ops Agent chat: Super Admin and Admin only (role checked in code); data only through agent_chat_tool as the caller.
      - name: Deploy agent-chat
        run: supabase functions deploy agent-chat --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Ops Agent connections (Slack, Cliq, email, webhook, n8n, API): Super Admin only (role checked in code).
      - name: Deploy agent-connections
        run: supabase functions deploy agent-connections --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Ops Agent inbound API: authenticates with an agent API key (hashed, rate limited, revocable), not a user JWT.
      - name: Deploy agent-inbound
        run: supabase functions deploy agent-inbound --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Ops Agent dispatcher: sends the outbox to connections. Called by pg_cron with the shared cron secret, not a user JWT.
      - name: Deploy agent-dispatch
        run: supabase functions deploy agent-dispatch --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Ops Agent Cliq watch: reads Cliq every 2 working hours for tagged messages with no answer. Cron-only (X-Cron-Secret), woken by agent_cliq_watch_tick().
      - name: Deploy agent-cliq-monitor
        run: supabase functions deploy agent-cliq-monitor --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Inbound webhooks for Database automations. Callers are external services, so no Supabase JWT: --no-verify-jwt,
      # and the function authenticates every request by an HMAC signature (X-KDOps-Signature) against the automation's secret.
      - name: Deploy webhook-inflow
        run: supabase functions deploy webhook-inflow --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes

      # Removes screenshot files whose row is gone. Cron-only (X-Cron-Secret), ticked daily by tick_timetrack_screenshot_cleaner().
      - name: Deploy timetrack-screenshot-cleaner
        run: supabase functions deploy timetrack-screenshot-cleaner --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt --yes
