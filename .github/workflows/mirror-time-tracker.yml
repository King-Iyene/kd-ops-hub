name: Mirror Time Tracker installers

# KD Ops Time Tracker: copies a PUBLISHED build onto OUR OWN update feed (the public "desktop-app" storage bucket, folder updates/tracker).
#
# Why: see "Mirror desktop installers". The installed tracker (its update address) and the "Get desktop app" button in Time Tracking both
# read this feed, never GitHub, so a build that is on the feed is a build everybody gets, and nobody can be left on an old version
# because GitHub said no.
#
# It runs by itself whenever "Build desktop agent installers" finishes; a build that was not published (no release for its version) is
# skipped. Run it by hand to repeat or repair (type a version, or leave it empty for the version of the code it runs on).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to put on the feed (leave empty for the version in desktop-agent/package.json)
        type: string
        default: ''
  workflow_run:
    workflows: ["Build desktop agent installers"]
    types: [completed]

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Work out the version and fetch the published build
        run: |
          set -e
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(jq -r .version desktop-agent/package.json); fi
          echo "KD Ops Time Tracker $V"
          if ! gh release view "desktop-agent-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "There is no published release desktop-agent-v$V (that build was not published), so there is nothing to put on the feed."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p dl
          gh release download "desktop-agent-v$V" --repo "$GITHUB_REPOSITORY" --dir dl
          ls -la dl

      - name: Get the storage key for the project (never printed)
        if: env.SKIP != '1'
        run: |
          set -e
          KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then echo "Could not read the project's service key with SUPABASE_ACCESS_TOKEN"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Put it on the update feed (installers first, the version files last, then check everybody can fetch it)
        if: env.SKIP != '1'
        run: bash scripts/publish-update-feed.sh tracker dl
