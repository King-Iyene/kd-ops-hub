name: Playwright E2E Tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      CI: true
      BASE_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: npx vite preview --port 4173 &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for http://localhost:4173..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4173 | grep -q "^[23]"; then
              echo "Server is ready."
              break
            fi
            sleep 1
          done

      - name: Run Playwright tests
        # ops-diagnose.spec.ts and guide-screenshots.spec.ts are both
        # workflow_dispatch-only (see ops-diagnose.yml and
        # guide-screenshots.yml) — the former needs OPS_FUNCTION/OPS_RPC set
        # and always fails on a routine push, the latter is a slow full
        # screenshot tour that doesn't belong in every CI run. Exclude both
        # by test title.
        run: npx playwright test --project=chromium --grep-invert "invoke an edge function or RPC|screenshots for team guide"

      - name: Upload HTML test report
        # Only on failure — a green run doesn't need its report kept, and
        # uploading on every push was what exhausted the repo's Actions
        # artifact storage quota (a full-but-unrelated quota error was
        # failing this job even when every test passed).
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure screenshots and traces
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: test-results/
          retention-days: 7
