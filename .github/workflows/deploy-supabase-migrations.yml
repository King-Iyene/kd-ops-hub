name: Deploy Supabase Migrations

# ─── SETUP ───────────────────────────────────────────────────────────────────
#
# Applies supabase/migrations/** to the PRODUCTION database whenever migrations
# change on main. Pairs with deploy-edge-functions.yml (functions) so the whole
# Supabase backend deploys automatically, the same way Vercel deploys the
# frontend.
#
# Required GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN — Personal Access Token from
#                           https://supabase.com/dashboard/account/tokens
#                           (a PAT, NOT the project anon/service_role key).
#
#   SUPABASE_PROJECT_REF  — your LIVE project ref (the slug in your project URL,
#                           e.g. the one your Edge Functions are hosted under).
#                           IMPORTANT: set this to the project your app actually
#                           uses in production.
#
#   SUPABASE_DB_PASSWORD  — the database password
#                           (Project Settings → Database → Connection / Password).
#
# Note: this applies migrations straight to production. Until you move to a
# Pro-plan preview/staging branch, keep migrations additive and review them
# before merging to main.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      # Also trigger when this workflow file changes so we can iterate on
      # deploy logic without waiting for the next migration commit.
      - '.github/workflows/deploy-supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: write is required so the "Alert on failure" step can open a
    # tracking issue when a deploy dies. Default GITHUB_TOKEN is read-only.
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          VERSION=$(curl -fsSL "https://api.github.com/repos/supabase/cli/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Installing Supabase CLI v${VERSION}"
          curl -fsSLo supabase.deb \
            "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_${VERSION}_linux_amd64.deb"
          sudo dpkg -i supabase.deb
          rm -f supabase.deb
          supabase --version

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Detach pre-applied legacy versions from history table
        # Three legacy files live in supabase/migrations/_pre_applied/ (see
        # that folder's README). Their version rows were recorded in remote's
        # supabase_migrations.schema_migrations when they originally ran.
        # Because those files are no longer in the scan path, `db push` now
        # complains: "Remote migration versions not found in local migrations
        # directory". `repair --status reverted` removes those version rows
        # from the tracking table — it does NOT run any DROP SQL, so the
        # columns / tables those migrations created stay in place. Idempotent:
        # the second run on a project that's already been repaired is a
        # silent no-op the CLI treats as informational.
        run: |
          supabase migration repair --status reverted 20260811000000 || true
          supabase migration repair --status reverted 20260812000000 || true
          supabase migration repair --status reverted 20260813000000 || true

      - name: Self-heal any additional orphan remote versions
        # SELF-HEALING GUARD.
        #
        # Anything that lands in remote schema_migrations WITHOUT a matching
        # local file (e.g. a hotfix executed in the Supabase SQL editor, a
        # migration file deleted after being applied, or a preview branch
        # replaying an older history) will otherwise abort `db push` with:
        #
        #   "Remote migration versions not found in local migrations directory"
        #
        # This step compares remote versions (from `supabase migration list`)
        # against local files and `repair --status reverted`s every orphan.
        # `repair` only removes the tracking row — it never drops schema —
        # so the objects those migrations created stay intact. Idempotent:
        # repairing an already-reverted version is a no-op.
        #
        # Failure of this step never blocks the push; if migration list
        # can't be parsed the push will surface a clearer error itself.
        run: |
          set -uo pipefail

          # Local versions (14-digit timestamp at the start of each filename).
          LOCAL=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename \
            | grep -oE '^[0-9]{14}' \
            | sort -u)

          # Remote versions from the CLI. `migration list` when linked prints
          # a table; extract every 14-digit token that appears in the REMOTE
          # column. We fall back gracefully if the column header ever moves.
          REMOTE=$(supabase migration list 2>/dev/null \
            | grep -oE '\b[0-9]{14}\b' \
            | sort -u)

          if [ -z "$REMOTE" ]; then
            echo "No remote migration versions detected — nothing to self-heal."
            exit 0
          fi

          # Orphans = versions on remote that have no local file.
          ORPHANS=$(comm -23 <(echo "$REMOTE") <(echo "$LOCAL"))

          if [ -z "$ORPHANS" ]; then
            echo "No orphan remote versions — history is in sync."
            exit 0
          fi

          echo "Detected orphan remote versions:"
          echo "$ORPHANS"
          for v in $ORPHANS; do
            echo "→ Reverting orphan $v"
            supabase migration repair --status reverted "$v" || true
          done

      - name: Push migrations to production
        id: push
        # No `--include-all` — approval_framework.sql and payment_state_rpcs.sql
        # (which shared timestamps 20260811 / 20260813 with legacy pre-applied
        # files) were moved into supabase/migrations/_pre_applied/ so they no
        # longer appear in the scan. That eliminates the PK-conflict class of
        # failure the older CLI silently swallowed: newer CLI versions treat
        # `repair --status reverted` as a status update (not a delete), so
        # re-pushing on top would collide with the existing schema_migrations
        # row. The self-heal step above still reconciles any true remote-only
        # orphans that appear later (e.g. hotfixes run in the SQL editor).
        run: supabase db push

      - name: Alert on failure (email via GitHub)
        if: ${{ failure() }}
        # When this step runs, GitHub auto-emails the workflow author + repo
        # admins with the failed-run link. That's already on by default at
        # your account level. This step also raises a repository issue so
        # the failure is IMPOSSIBLE to miss in the normal PR / issue flow.
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha  = context.sha.substring(0, 7);
            const url  = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `[migration deploy] failed on ${sha}`;
            const body  = [
              `The Supabase migration deploy for commit \`${sha}\` FAILED.`,
              ``,
              `Nothing in \`supabase/migrations/\` has reached production for this push.`,
              ``,
              `Investigate: ${url}`,
              ``,
              `> This issue was opened by the deploy-supabase-migrations workflow.`,
              `> Close it once the underlying failure is resolved and a re-run succeeds.`,
            ].join("\n");
            // De-dupe: if there's already an open failure issue for this
            // commit, reuse it instead of stacking new ones.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "migration-deploy-failure",
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["migration-deploy-failure"],
              });
            }
