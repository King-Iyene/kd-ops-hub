name: Deploy Supabase Migrations

# ─── SETUP ───────────────────────────────────────────────────────────────────
#
# Applies supabase/migrations/** to the PRODUCTION database whenever migrations
# change on main. Pairs with deploy-edge-functions.yml (functions) so the whole
# Supabase backend deploys automatically, the same way Vercel deploys the
# frontend.
#
# Required GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN — Personal Access Token from
#                           https://supabase.com/dashboard/account/tokens
#                           (a PAT, NOT the project anon/service_role key).
#
#   SUPABASE_PROJECT_REF  — your LIVE project ref (the slug in your project URL,
#                           e.g. the one your Edge Functions are hosted under).
#                           IMPORTANT: set this to the project your app actually
#                           uses in production.
#
#   SUPABASE_DB_PASSWORD  — the database password
#                           (Project Settings → Database → Connection / Password).
#
# Note: this applies migrations straight to production. Until you move to a
# Pro-plan preview/staging branch, keep migrations additive and review them
# before merging to main.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      # Also trigger when this workflow file changes so we can iterate on
      # deploy logic without waiting for the next migration commit.
      - '.github/workflows/deploy-supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: write is required so the "Alert on failure" step can open a
    # tracking issue when a deploy dies. Default GITHUB_TOKEN is read-only.
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          VERSION=$(curl -fsSL "https://api.github.com/repos/supabase/cli/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Installing Supabase CLI v${VERSION}"
          curl -fsSLo supabase.deb \
            "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_${VERSION}_linux_amd64.deb"
          sudo dpkg -i supabase.deb
          rm -f supabase.deb
          supabase --version

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Repair migration history for pre-applied legacy files
        # Three legacy files (sprint_a_b / sprint_c_leave / sprint_d_probation)
        # sit at earlier timestamps than what remote has already applied,
        # AND their version rows are already recorded in
        # supabase_migrations.schema_migrations. Without repair, --include-all
        # succeeds on the idempotent SQL body but then bombs on the version
        # INSERT ("duplicate key … schema_migrations_pkey"). Repair syncs the
        # CLI's view with the remote applied-list so the next `db push` skips
        # them silently. `|| true` because repair on an already-consistent
        # version is a no-op that the CLI treats as informational, not error.
        run: |
          supabase migration repair --status applied 20260811000000 || true
          supabase migration repair --status applied 20260812000000 || true
          supabase migration repair --status applied 20260813000000 || true

      - name: Push migrations to production
        id: push
        # Standard push — no --include-all. The repair step above already
        # tells the CLI those three legacy files are applied; any other
        # local file with a timestamp older than the remote head would still
        # trip the "Found local migration files to be inserted" guard, in
        # which case we'd repair-mark them the same way.
        run: supabase db push

      - name: Alert on failure (email via GitHub)
        if: ${{ failure() }}
        # When this step runs, GitHub auto-emails the workflow author + repo
        # admins with the failed-run link. That's already on by default at
        # your account level. This step also raises a repository issue so
        # the failure is IMPOSSIBLE to miss in the normal PR / issue flow.
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha  = context.sha.substring(0, 7);
            const url  = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `[migration deploy] failed on ${sha}`;
            const body  = [
              `The Supabase migration deploy for commit \`${sha}\` FAILED.`,
              ``,
              `Nothing in \`supabase/migrations/\` has reached production for this push.`,
              ``,
              `Investigate: ${url}`,
              ``,
              `> This issue was opened by the deploy-supabase-migrations workflow.`,
              `> Close it once the underlying failure is resolved and a re-run succeeds.`,
            ].join("\n");
            // De-dupe: if there's already an open failure issue for this
            // commit, reuse it instead of stacking new ones.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "migration-deploy-failure",
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["migration-deploy-failure"],
              });
            }
