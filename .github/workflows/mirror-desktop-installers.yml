name: Mirror desktop installers

# KD Ops desktop app: copies a PUBLISHED build onto OUR OWN update feed (the public "desktop-app" storage bucket, folder updates/office).
#
# Why: the app is built into releases of this PRIVATE repository, which only people with a GitHub login to it can read. If installed apps
# or the Download button asked GitHub, people without access got nothing, and apps silently stopped updating. The feed is public by design
# (an installer is not a secret) and is the ONE place both the installed apps (their update address) and the Download button read.
#
# It runs by itself whenever "Build KD Ops desktop app" finishes, so publishing can never be forgotten again: a build that was not
# published (no release for its version) is simply skipped. Run it by hand to repeat or repair (type a version, or leave it empty for
# the version of the code it runs on). It uses the same secrets the other Supabase workflows use; no new secret is needed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to put on the feed (leave empty for the version in desktop-office/package.json)
        type: string
        default: ''
  workflow_run:
    workflows: ["Build KD Ops desktop app"]
    types: [completed]

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the code the build ran on, so its version is the one that was built
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Work out the version and fetch the published build
        run: |
          set -e
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(jq -r .version desktop-office/package.json); fi
          echo "KD Ops $V"
          if ! gh release view "office-desktop-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "There is no published release office-desktop-v$V (that build was not published), so there is nothing to put on the feed."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p dl
          gh release download "office-desktop-v$V" --repo "$GITHUB_REPOSITORY" --dir dl
          ls -la dl

      - name: Get the storage key for the project (never printed)
        if: env.SKIP != '1'
        run: |
          set -e
          KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then echo "Could not read the project's service key with SUPABASE_ACCESS_TOKEN"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Make sure the project accepts files this big
        if: env.SKIP != '1'
        run: |
          set -e
          NOW=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/config/storage" | jq -r '.fileSizeLimit // 0')
          echo "Current storage file size limit: $NOW bytes"
          if [ "$NOW" -lt 314572800 ]; then
            echo "Raising it to 300 MB"
            curl -sS -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d '{"fileSizeLimit": 314572800}' "https://api.supabase.com/v1/projects/$REF/config/storage" || true
          fi

      - name: Put it on the update feed (installers first, the version files last, then check everybody can fetch it)
        if: env.SKIP != '1'
        run: bash scripts/publish-update-feed.sh office dl
