name: Deploy Paystack Proxy to Fly.io

# ─── SETUP ───────────────────────────────────────────────────────────────────
#
# Deploys the Paystack API proxy to Fly.io on push to main.
# The proxy gives Supabase Edge Functions a static egress IP
# for Paystack's IP whitelist.
#
# Required GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#
#   FLY_API_TOKEN  — Fly.io deploy token. Get it from:
#                    https://fly.io/dashboard → Tokens → Create deploy token
#
#   PROXY_KEY      — Shared secret between Edge Functions and the proxy.
#                    Generate: go to https://generate.plus/en/hex and copy
#                    a 64-char hex string (or any strong password, min 16 chars).
#                    Must also be set in Supabase as PAYSTACK_PROXY_KEY.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'paystack-proxy/**'
      - '.github/workflows/deploy-paystack-proxy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Create the app if it doesn't exist yet (first-time deploy)
      - name: Ensure Fly.io app exists
        working-directory: paystack-proxy
        run: |
          flyctl apps list | grep -q kdops-paystack-proxy || \
            flyctl apps create kdops-paystack-proxy --org personal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Set the proxy auth secret before deploy so the app starts correctly
      - name: Set PROXY_KEY secret
        working-directory: paystack-proxy
        run: flyctl secrets set PROXY_KEY="${{ secrets.PROXY_KEY }}" --app kdops-paystack-proxy --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Allocate a static EGRESS IP so outbound traffic has a stable address.
      # This is idempotent — if one already exists for lhr it prints a warning and continues.
      - name: Ensure static egress IP (lhr)
        working-directory: paystack-proxy
        run: |
          echo "Checking for existing egress IPs..."
          EXISTING=$(flyctl ips list --app kdops-paystack-proxy 2>&1 | grep -i egress || true)
          if [ -z "$EXISTING" ]; then
            echo "No egress IP found — allocating one in lhr..."
            flyctl ips allocate-egress --app kdops-paystack-proxy -r lhr -y
          else
            echo "Egress IP already allocated:"
            echo "$EXISTING"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        working-directory: paystack-proxy
        run: flyctl deploy --remote-only --app kdops-paystack-proxy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Print ALL IPs including the egress IP — the EGRESS IPv4 is what Paystack needs
      - name: Show IPs (whitelist the EGRESS IPv4 on Paystack)
        working-directory: paystack-proxy
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  ALL IPs (look for 'egress' type)"
          echo "══════════════════════════════════════════════════"
          flyctl ips list --app kdops-paystack-proxy
          echo ""
          echo "══════════════════════════════════════════════════"
          echo "  ⚠️  WHITELIST THE EGRESS IPv4 ON PAYSTACK"
          echo "  (NOT the v4/v6 public IPs — those are inbound)"
          echo "══════════════════════════════════════════════════"
          echo "  After deploy, verify with:"
          echo "  curl https://kdops-paystack-proxy.fly.dev/diag/ip"
          echo "══════════════════════════════════════════════════"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
