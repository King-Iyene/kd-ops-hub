name: Build desktop agent installers

# Builds the native KD Ops Time Tracker desktop app (desktop-agent/) into real,
# installable artifacts for Windows, macOS, and Linux, and publishes them as
# assets on a GitHub Release.
#
# Each OS builds its own installer NATIVELY on its own runner — this is the
# standard, reliable way to cross-platform-package Electron apps (a macOS
# .dmg genuinely cannot be built on Linux; trying to cross-compile it is
# fragile and unsupported upstream). electron-builder also rebuilds the
# active-win native module for each OS/arch here, which needs real internet
# access to nodejs.org/electronjs.org — unavailable in some sandboxed
# environments, which is exactly why this runs in CI rather than being
# faked as a local build.
#
# Required repo configuration (Settings → Secrets and variables → Actions):
#   - SUPABASE_URL          (Variable — safe to be plaintext; derivable from
#                             supabase/config.toml's project_id, but set
#                             explicitly here for clarity)
#   - SUPABASE_ANON_KEY     (Secret or Variable — this is the public,
#                             RLS-gated anon key, same one already used by
#                             the web app's VITE_SUPABASE_ANON_KEY. Safe to
#                             ship inside the installer; NOT the service
#                             role key.)
# Until SUPABASE_ANON_KEY is set, installers still build successfully, but
# the packaged app shows a "not configured" screen instead of connecting —
# see desktop-agent/src/supabaseClient.ts.
#
# Triggers:
#   - push of a tag matching "desktop-agent-v*" (real release)
#   - manual dispatch (for verification builds without cutting a release)

on:
  push:
    tags:
      - "desktop-agent-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-args: --linux
          - os: windows-latest
            build-args: --win
          - os: macos-latest
            build-args: --mac
    runs-on: ${{ matrix.os }}
    # Hard cap so a hang (this job has had two already, both well past an
    # hour) fails loud and fast instead of silently burning CI time —
    # every real run of this job to date, successful or not, has settled
    # one way or the other well under 20 minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-agent/package-lock.json

      # node-gyp (used to rebuild the active-win native module for Electron's
      # ABI) needs a Python with distutils. macOS/ubuntu runner default
      # Python is 3.12+, which dropped distutils — pin 3.11 everywhere so
      # the native rebuild step behaves the same on every OS.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Build and package (unsigned)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          # Unsigned builds: no Apple/Windows code-signing certificates are
          # configured. Users will see an "unidentified developer" /
          # "Windows protected your PC" warning on first run — expected
          # until certificates are purchased and added as secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # This job has hung at the IDENTICAL point three times running —
          # @electron/rebuild logs "preparing moduleName=active-win" and then
          # nothing, ever, on all three OSes — with two different fixes
          # (npm_config_build_from_source, then package.json's
          # build.buildDependenciesFromSource) both confirmed via logs to
          # have actually taken effect (buildFromSource=true both times)
          # and NEITHER changing the outcome at all. That rules out the
          # prebuilt-vs-source download path as the cause: whatever's stuck
          # happens before or regardless of that fork, with zero log output
          # either way, so there's nothing left to infer from the log as
          # it stands — these DEBUG/verbose flags are so the next run's
          # (cancelled, if needed) log actually shows what it's doing
          # instead of going silent at "preparing".
          DEBUG: 'electron-rebuild,electron-notarize'
          npm_config_loglevel: verbose
          # Also authenticate electron-builder's GitHub API calls (e.g.
          # resolving the latest release, even with --publish=never) so
          # they aren't subject to GitHub's much lower unauthenticated
          # rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # node-gyp's Visual Studio auto-detection on windows-latest can
          # fail to recognize the pre-installed VS2022 Build Tools edition;
          # pinning the version explicitly is the documented workaround.
          GYP_MSVS_VERSION: 2022
        run: |
          npm run build
          npx electron-builder ${{ matrix.build-args }} --publish=never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.os }}
          path: |
            desktop-agent/release/*.AppImage
            desktop-agent/release/*.deb
            desktop-agent/release/*.exe
            desktop-agent/release/*.dmg
            desktop-agent/release/*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-agent-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-agent-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "KD Ops Time Tracker ${{ github.ref_name }}"
          body: |
            Native desktop agent for KD Ops Hub time tracking — tracks active
            window/app outside the browser, same as the rest of the Time
            Tracking module. Unsigned builds: your OS will show an
            "unidentified developer" / SmartScreen warning on first run;
            that's expected until code-signing certificates are added.
          files: artifacts/**
          draft: false
          prerelease: false
