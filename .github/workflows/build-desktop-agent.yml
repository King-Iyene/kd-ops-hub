name: Build desktop agent installers

# Builds the native KD Ops Time Tracker desktop app (desktop-agent/) into real,
# installable artifacts for Windows, macOS, and Linux, and publishes them as
# assets on a GitHub Release.
#
# Each OS builds its own installer NATIVELY on its own runner — this is the
# standard, reliable way to cross-platform-package Electron apps (a macOS
# .dmg genuinely cannot be built on Linux; trying to cross-compile it is
# fragile and unsupported upstream), which is exactly why this runs in CI
# rather than being faked as a local build.
#
# active-win (desktop-agent's only native dependency) is an N-API addon,
# whose whole point is ABI stability across Node/Electron versions without
# recompilation — `npm install` already fetches the correct prebuilt binary
# for it via node-pre-gyp. electron-builder's own native-rebuild step
# (`npmRebuild`, on by default) is redundant for N-API modules and is
# disabled in desktop-agent/package.json's build config; see that key for
# why, and for how this was diagnosed (the rebuild step hung identically,
# with zero output, on all three OSes).
#
# Required repo configuration (Settings → Secrets and variables → Actions):
#   - SUPABASE_URL          (Variable — safe to be plaintext; derivable from
#                             supabase/config.toml's project_id, but set
#                             explicitly here for clarity)
#   - SUPABASE_ANON_KEY     (Secret or Variable — this is the public,
#                             RLS-gated anon key, same one already used by
#                             the web app's VITE_SUPABASE_ANON_KEY. Safe to
#                             ship inside the installer; NOT the service
#                             role key.)
# Until SUPABASE_ANON_KEY is set, installers still build successfully, but
# the packaged app shows a "not configured" screen instead of connecting —
# see desktop-agent/src/supabaseClient.ts.
#
# Triggers:
#   - push of a tag matching "desktop-agent-v*" (real release)
#   - manual dispatch (for verification builds without cutting a release)

on:
  push:
    tags:
      - "desktop-agent-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-args: --linux
          - os: windows-latest
            build-args: --win
          - os: macos-latest
            build-args: --mac
    runs-on: ${{ matrix.os }}
    # Hard cap so any future hang fails loud and fast instead of silently
    # burning CI time, rather than a safety net against a known issue —
    # see the npmRebuild note above for the hang this job used to hit.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-agent/package-lock.json

      # Safety net for `npm install`'s own node-pre-gyp step for active-win:
      # it only needs to compile (via node-gyp, which needs a Python with
      # distutils — dropped in the macOS/ubuntu runners' default 3.12+) if
      # its prebuilt-binary download ever fails. Pinning 3.11 keeps that
      # fallback path working the same on every OS if it's ever hit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Build and package (unsigned)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          # Unsigned builds: no Apple/Windows code-signing certificates are
          # configured. Users will see an "unidentified developer" /
          # "Windows protected your PC" warning on first run — expected
          # until certificates are purchased and added as secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Also authenticate electron-builder's GitHub API calls (e.g.
          # resolving the latest release, even with --publish=never) so
          # they aren't subject to GitHub's much lower unauthenticated
          # rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.build-args }} --publish=never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.os }}
          path: |
            desktop-agent/release/*.AppImage
            desktop-agent/release/*.deb
            desktop-agent/release/*.exe
            desktop-agent/release/*.dmg
            desktop-agent/release/*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-agent-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-agent-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "KD Ops Time Tracker ${{ github.ref_name }}"
          body: |
            Native desktop agent for KD Ops Hub time tracking — tracks active
            window/app outside the browser, same as the rest of the Time
            Tracking module. Unsigned builds: your OS will show an
            "unidentified developer" / SmartScreen warning on first run;
            that's expected until code-signing certificates are added.
          files: artifacts/**
          draft: false
          prerelease: false
