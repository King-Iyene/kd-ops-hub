name: Daily Database Backup

# Runs every day at 02:00 WAT (01:00 UTC).
# Uses the Supabase CLI + your existing SUPABASE_ACCESS_TOKEN secret —
# no database password or connection string needed.
#
# ─── ONE-TIME SETUP ──────────────────────────────────────────────────────────
#
# You already have SUPABASE_ACCESS_TOKEN in your GitHub secrets. ✅
# You only need to add ONE more secret:
#
#   1. Find your project ref:
#      Open your Supabase project — look at the URL:
#      https://supabase.com/dashboard/project/YOUR_REF_IS_THIS_PART
#
#   2. GitHub repo → Settings → Secrets and variables → Actions → New secret
#      Name:  SUPABASE_PROJECT_REF
#      Value: paste your project ref (e.g. abcdefghijklmnop)
#
#   3. Done. Backup runs tonight automatically.
#      Verify: Actions tab → "Daily Database Backup" → green checkmark ✅
#
# ─── STORAGE & LIMITS ────────────────────────────────────────────────────────
#
# GitHub Free plan: 500 MB total artifact storage.
# 30-day retention × ~3 MB/backup = ~90 MB used — well within the free limit.
# The size-check step warns you if a backup exceeds 15 MB.
#
# ─── HOW TO RESTORE ──────────────────────────────────────────────────────────
#
# 1. GitHub → Actions tab → "Daily Database Backup" → click any past run
# 2. Scroll to "Artifacts" at the bottom → download the zip
# 3. Unzip → you get a backup.sql.gz file
# 4. gunzip backup.sql.gz
# 5. psql "postgresql://postgres:[password]@db.[ref].supabase.co:5432/postgres" < backup.sql
#    Or paste specific sections into the Supabase SQL editor.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 02:00 WAT every day
  workflow_dispatch:       # Manual trigger from Actions tab

jobs:
  backup:
    name: Dump & upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Install matching pg_dump (server is Postgres 17)
        # Ubuntu 24.04 runners ship pg_dump 16 by default. pg_dump refuses
        # to dump a NEWER server ("aborting because of server version
        # mismatch") — confirmed live against this project's Postgres 17.6.
        # Installing the versioned postgresql-client-17 package (from the
        # official PGDG apt repo) and calling that binary explicitly avoids
        # relying on whatever "pg_dump" resolves to on the runner image,
        # which will keep drifting as GitHub updates the default image.
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump database
        env:
          # Passed as env vars, not interpolated into a connection URL —
          # SUPABASE_DB_PASSWORD contains an unescaped '@' which corrupts
          # a "postgresql://postgres:$PW@host" string (pg_dump then reads
          # everything after the password's own '@' as the hostname, e.g.
          # "17@db.xxx.supabase.co" instead of "db.xxx.supabase.co" —
          # confirmed live: this is why every run has failed with
          # "could not translate host name". PGPASSWORD/PGHOST/etc. are
          # libpq's standard env vars and need no URL-escaping at all.
          #
          # PGHOST is the Session Pooler (aws-0-<region>.pooler.supabase.com),
          # not the direct db.<ref>.supabase.co host. Confirmed live: the
          # direct host now resolves correctly (the fix above works) but only
          # to an IPv6 address, and GitHub-hosted runners fail on it with
          # "Network is unreachable" — Supabase's direct connections are
          # IPv6-only by default; the pooler is the IPv4-compatible path they
          # document for exactly this (CI/CD runners without IPv6). Session
          # mode (port 5432, not the 6543 transaction pooler) is required
          # here because pg_dump needs a real session, which transaction
          # pooling doesn't support. PGUSER includes the project ref suffix,
          # which the pooler needs to route to the right project.
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-0-eu-west-1.pooler.supabase.com
          PGPORT: 5432
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGDATABASE: postgres
        run: |
          # Use pg_dump directly against the Supabase direct connection.
          # The Supabase CLI's `db dump` runs pg_dump inside a Docker
          # container that can't resolve the "postgres" hostname in GitHub
          # Actions runners, so we bypass it entirely.
          TIMESTAMP=$(date +%Y-%m-%d)
          pg_dump --no-owner --no-privileges -f "kdops-backup-${TIMESTAMP}.sql"
          gzip "kdops-backup-${TIMESTAMP}.sql"
          echo "BACKUP_FILE=kdops-backup-${TIMESTAMP}.sql.gz" >> "$GITHUB_ENV"

      - name: Check backup size
        run: |
          SIZE=$(du -sh "${{ env.BACKUP_FILE }}" | cut -f1)
          SIZE_BYTES=$(stat -c%s "${{ env.BACKUP_FILE }}")
          echo "Backup size: $SIZE"
          if [ "$SIZE_BYTES" -gt 15728640 ]; then
            echo "⚠️  WARNING: backup > 15 MB — monitor GitHub storage usage."
            echo "   Fix: reduce retention_days in this file, or upgrade GitHub to Pro ($4/mo)."
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Summary
        run: |
          echo "### ✅ Backup complete" >> "$GITHUB_STEP_SUMMARY"
          echo "File: \`${{ env.BACKUP_FILE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -sh ${{ env.BACKUP_FILE }} | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Retained for: 30 days" >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure (email via GitHub)
        if: ${{ failure() }}
        # A silently-failed nightly backup is worse than a failed deploy — you
        # don't find out until you actually need to restore. This mirrors
        # deploy-supabase-migrations.yml's failure alert: GitHub already
        # emails the workflow author + repo admins by default, and this also
        # raises a repository issue so a missed night can't slip by unnoticed.
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const date  = new Date().toISOString().slice(0, 10);
            const url   = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `[db backup] failed on ${date}`;
            const body  = [
              `The nightly database backup for ${date} FAILED.`,
              ``,
              `No backup artifact was produced for this run — the most recent successful backup is the last restore point available.`,
              ``,
              `Investigate: ${url}`,
              ``,
              `> This issue was opened by the daily-backup workflow.`,
              `> Close it once the underlying failure is resolved and a re-run succeeds.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "backup-failure",
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["backup-failure"],
              });
            }
