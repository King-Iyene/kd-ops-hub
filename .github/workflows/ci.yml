name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pre-existing debt: 993 tsc errors across unrelated files (Fleet,
      # EmployeeProfile, useOfflineQueue, Placements, etc.), predating this
      # workflow. Non-blocking until that debt is paid down; lint/test/build
      # above and below stay hard gates.
      #
      # The count is stated exactly because it is the only way to tell
      # whether a change made things worse: `npm run typecheck 2>&1 |
      # grep -c "error TS"` against your branch and against main should
      # give the same number. This comment previously said "~150", then
      # "~205"; both were stale, and a stale figure is worse than none —
      # it invites you to assume your new errors are part of the backlog.
      # Measured 2026-09-18 on d279492. If you change it, measure it.
      - name: Type-check
        run: npm run typecheck
        continue-on-error: true

      # Unit tests (payroll/tax/money arithmetic — exactly the math this app
      # exists to get right) previously ran nowhere in CI. Confirmed all 253
      # tests across 20 files pass before adding this as a hard gate.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
