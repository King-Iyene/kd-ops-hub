name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pre-existing debt: ~150 tsc errors across unrelated files (Transactions,
      # Recruitment, ContractorApplications, etc.), predating this workflow and
      # out of scope for the security hardening in this change. Non-blocking
      # until that debt is paid down; lint above stays a hard gate.
      - name: Type-check
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build
