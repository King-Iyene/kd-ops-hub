name: Payroll Live Verification (manual)

# One-shot, manually-triggered verification that the payroll run pipeline
# (draft -> submit -> approve -> generate payslips) actually works
# end-to-end against the live database, using the same Super Admin test
# account as the regular E2E suite. This mutates real production payroll
# data for the targeted period (see tests/payroll-live-verification.spec.ts)
# — it must never run on a routine push, only when someone deliberately
# triggers it here.

on:
  workflow_dispatch:

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      CI: true
      BASE_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: npx vite preview --port 4173 &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for http://localhost:4173..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4173 | grep -q "^[23]"; then
              echo "Server is ready."
              break
            fi
            sleep 1
          done

      - name: Run payroll live verification
        run: npx playwright test --project=live-verification

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # storage quota, etc. shouldn't mask the real test result
        with:
          name: payroll-live-verification-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: payroll-live-verification-screenshots
          path: test-results/
          retention-days: 30
