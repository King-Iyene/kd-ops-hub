name: Build KD Ops desktop app

# Builds the KD Ops desktop app (desktop-office/: KD Ops and the Office in one window) for Windows, macOS and Linux as downloadable workflow artifacts.
# It only publishes when "publish" is ticked in Run workflow (tick it only when the owner says so); otherwise download the installers
# from the run page. A published build is the versioned release plus the update channel. Publish the versioned release with --latest=false (the Time Tracker owns "Latest"),
# and put the same files (including latest*.yml) on the release tagged kd-ops-desktop-channel, which is where installed apps look for updates. Each installer is built on its own operating system, because a macOS .dmg
# cannot be built on Linux.
#
# After a published build finishes, "Mirror desktop installers" puts it on OUR OWN update feed (public storage, folder updates/office) by itself.
# That feed is what the app (since 0.3.9) updates from and what the Download button reads; the GitHub channel above stays only so that
# older installed apps (0.3.8 and earlier, which look there) still find the new version and move onto the feed.
#
# Mac note: the app is not signed with an Apple developer account, so macOS shows a warning the first time
# (right-click the app, choose Open). Signing needs a paid Apple developer account.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build (the release and the update channel, so installed apps update by themselves)
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-args: --linux
          - os: windows-latest
            build-args: --win
          - os: macos-latest
            build-args: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test the app (opens it and checks notifications, tray and the offline screen)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: npm test
      - name: Build installer
        run: npx electron-builder ${{ matrix.build-args }} --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: kd-ops-${{ matrix.os }}
          path: |
            desktop-office/release/*.exe
            desktop-office/release/*.dmg
            desktop-office/release/*.zip
            desktop-office/release/*.AppImage
            desktop-office/release/*.deb
            desktop-office/release/latest*.yml
            desktop-office/release/*.blockmap
          if-no-files-found: error
          retention-days: 3

  # Publishing is the step that was forgotten before: installed apps only update from the "kd-ops-desktop-channel" release, so a build that was
  # never put there left every employee on the old version until they reinstalled. Tick "publish" when running the workflow and it does it:
  # the versioned release (not marked Latest, the Time Tracker owns that) and the update channel, Windows files first and latest.yml last.
  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release and the update channel
        run: |
          set -e
          V=$(node -p "require('./desktop-office/package.json').version")
          echo "Publishing KD Ops $V"
          WIN=$(ls dist/kd-ops-windows-latest/*.exe dist/kd-ops-windows-latest/*.blockmap)
          MAC=$(ls dist/kd-ops-macos-latest/*.dmg dist/kd-ops-macos-latest/*.zip dist/kd-ops-macos-latest/*.blockmap 2>/dev/null || true)
          LIN=$(ls dist/kd-ops-ubuntu-latest/*.AppImage dist/kd-ops-ubuntu-latest/*.deb 2>/dev/null || true)
          if gh release view "office-desktop-v$V" >/dev/null 2>&1; then
            echo "release office-desktop-v$V exists: adding the files to it"
            gh release upload "office-desktop-v$V" --clobber $WIN $MAC $LIN dist/*/latest*.yml
          else
            gh release create "office-desktop-v$V" --target "$GITHUB_SHA" --latest=false --title "KD Ops desktop app $V" \
              --notes "KD Ops $V. Windows: KD-Ops-Setup-$V.exe. Mac: KD-Ops-$V.dmg. Linux: KD-Ops-$V.AppImage. Installed apps update by themselves." \
              $WIN $MAC $LIN dist/*/latest*.yml
          fi
          # the update channel: installers first, then the latest*.yml files that tell installed apps a new version exists
          gh release upload kd-ops-desktop-channel --clobber $WIN $MAC $LIN
          gh release upload kd-ops-desktop-channel --clobber dist/kd-ops-windows-latest/latest.yml
          gh release upload kd-ops-desktop-channel --clobber dist/kd-ops-macos-latest/latest-mac.yml dist/kd-ops-ubuntu-latest/latest-linux.yml
          curl -sL https://github.com/${{ github.repository }}/releases/download/kd-ops-desktop-channel/latest.yml | head -3
